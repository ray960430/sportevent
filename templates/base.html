<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>{% block title %}動競 Taiwan Sports Hub{% endblock %}</title>
  <meta name="description" content="動競 Taiwan Sports Hub，台灣運動賽事、球星與在地活動一次掌握。">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Noto Sans TC',sans-serif}.grid-bg{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px}.accent{color:#b6f35b}.focus-ring:focus{outline:2px solid #b6f35b;outline-offset:3px}
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <header class="bg-[#0b1220] text-white border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center gap-2 font-black tracking-tight text-xl"><span class="w-8 h-8 rounded-lg bg-lime-300 text-slate-950 grid place-items-center">動</span>動競<span class="text-slate-400 text-xs font-medium hidden sm:inline">TAIWAN SPORTS HUB</span></a>
      <nav class="flex items-center gap-1 sm:gap-2 text-xs sm:text-sm text-slate-300 overflow-x-auto">
        <a class="px-2 sm:px-3 py-2 rounded-lg hover:bg-white/10 hover:text-white whitespace-nowrap" href="/sports">運動百科</a>
        <a class="px-2 sm:px-3 py-2 rounded-lg hover:bg-white/10 hover:text-white whitespace-nowrap" href="/schedule">賽事賽程</a>
        <a class="px-2 sm:px-3 py-2 rounded-lg hover:bg-white/10 hover:text-white whitespace-nowrap" href="/players">球星車手</a>
        <a class="px-2 sm:px-3 py-2 rounded-lg hover:bg-white/10 hover:text-white whitespace-nowrap" href="/activities">在地活動</a>
      </nav>
    </div>
  </header>
  <main class="flex-1">{% block content %}{% endblock %}</main>
  <footer class="bg-[#0b1220] text-slate-400 py-8 mt-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between gap-3 text-xs">
      <p>© 2026 動競 Taiwan Sports Hub · 為台灣運動迷而做</p><p>賽事時間皆以台灣時間呈現 · 活動資訊請以主辦單位公告為準</p>
    </div>
  </footer>
</body>
</html>
